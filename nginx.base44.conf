server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Allow large image-slot state JSON to be fetched
    client_max_body_size 20m;

    location / {
        try_files $uri $uri/ $uri.html =404;
    }

    # Correct MIME type for .js files (nginx maps to application/octet-stream sometimes)
    types {
        text/css css;
        application/javascript js;
        application/json json;
        image/svg+xml svg;
    }
}
